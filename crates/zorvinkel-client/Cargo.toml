[package]
name = "zorvinkel-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
zorvinkel-application.workspace = true
zorvinkel-core.workspace = true
zorvinkel-protocol.workspace = true
zorvinkel-adapters.workspace = true
zorvinkel-terminal = { workspace = true, optional = true }
zeroize = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "net", "sync", "io-util"], optional = true }

eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
resvg = { version = "0.46.0", default-features = false, optional = true }
zorvinkel-bird-avatars = { git = "https://github.com/wizkah/zorvinkel-bird-avatars", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
sys-locale = { version = "0.3.2", optional = true }

[features]
ble-client = ["zorvinkel-adapters/ble-client", "dep:tokio"]
gui = ["dep:zorvinkel-terminal", "dep:zeroize", "dep:tokio", "dep:eframe", "dep:qrcode", "dep:image", "dep:resvg", "dep:zorvinkel-bird-avatars", "dep:sys-locale"]
security = ["zorvinkel-adapters/security"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry"] }
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "io-util"] }
