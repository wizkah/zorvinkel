[package]
name = "zorvinkel-adapters"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
zorvinkel-core.workspace = true
zorvinkel-application.workspace = true
zorvinkel-protocol.workspace = true
btleplug = { version = "0.13.5", optional = true }
uuid = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util", "process"], optional = true }
futures-util = { version = "0.3", optional = true }
mdns-sd = { version = "=0.21.7", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
toml = { version = "1", default-features = false, features = ["parse", "serde"], optional = true }

snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"], optional = true }
zeroize = "1"
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "=0.17.4", features = ["bluetoothd"], optional = true }
dbus = { version = "0.9.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.5", default-features = false }
objc2-core-wlan = { version = "=0.3.2", default-features = false, features = ["CoreWLANTypes", "CoreWLANUtil"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSString"] }
security-framework = { version = "=3.7.0", default-features = false, optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_NetworkManagement_WiFi"] }

[features]
ble-client = ["tunnel", "dep:btleplug", "dep:uuid", "dep:tokio", "dep:futures-util", "dep:mdns-sd"]
ble-server = ["tunnel", "dep:bluer", "dep:uuid", "dep:tokio", "dep:futures-util", "dep:serde", "dep:toml", "dep:mdns-sd"]
network-manager = ["dep:dbus", "dep:getrandom"]
tunnel = ["security", "dep:tokio"]
security = ["dep:sha2", "dep:getrandom", "dep:snow", "dep:security-framework", "dep:security-framework-sys"]
