[package]
name = "zorvinkel-terminal"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `ring` instead of the default `aws-lc-rs`: the latter needs NASM to build on Windows.
russh = { version = "=0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
vt100 = "=0.18.1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "test-util"] }
