# Lizenzprüfung: cargo deny --all-features check licenses
[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# LGPL-2.1-or-later steht bei r-efi nur als dritte Wahloption (MIT OR Apache-2.0 OR LGPL-2.1-or-later)
# und ist bewusst nicht erlaubt.
