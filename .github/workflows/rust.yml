name: Rust
on: [push, pull_request]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          arguments: --all-features
      - if: runner.os == 'Linux'
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          packaging/licenses.sh
          git diff --exit-code THIRD-PARTY-LICENSES.md
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --all-features --locked
      - if: runner.os == 'Linux'
        run: cargo test --manifest-path vendor/bluer/Cargo.toml --locked --lib --features bluetoothd legacy_options_tests
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked -p zorvinkel-client -- --simulate
      - run: cargo run --locked -p zorvinkeld -- --simulate
      - run: cargo run --locked -p zorvinkel-client --features security -- --secure-simulate
